version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
      biome:
        patterns:
          - '@biomejs/*'
      test:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - 'svelte-check'
          - '@testing-library/*'
      tooling:
        patterns:
          - 'vite'
          - 'typescript'
          - 'lefthook'
          - 'esbuild'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10