pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,mts,cts,jsx,tsx,svelte,css,json,yaml,yml,toml,html}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    full-check:
      run: bun run check
    tests:
      run: bun run test

commit-msg:
  commands:
    cog:
      run: cog verify --file {1}